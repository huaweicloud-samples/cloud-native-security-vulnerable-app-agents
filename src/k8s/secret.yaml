# 应用配置 Secret（占位符，请勿提交真实值）
# 部署前请填写真实值；建议改用 sealed-secrets / 凭据管理服务，而非明文提交。
apiVersion: v1
kind: Secret
metadata:
  name: nimbus-app-secret
type: Opaque
stringData:
  # DDS 节点连接端点（来自 terraform output dds_connection，形如 host:port,host:port）
  MONGO_HOSTS: "10.20.1.10:8635,10.20.1.11:8635,10.20.1.12:8635"
  # DDS 管理员账号（默认 rwuser）
  MONGO_USER: "rwuser"
  # DDS 管理员密码（来自 var.dds_password，敏感）
  MONGO_PASSWORD: "Replace-With-Strong-Password-123!"
  # 认证库（MongoDB 兼容默认 admin）
  MONGO_AUTH_DB: "admin"
  # 演示数据库名
  MONGO_DB_NAME: "nimbus"
  # 演示开关：true 时数据页返回 5xx（供运维智能体排查）
  BREAK_APP: "false"
